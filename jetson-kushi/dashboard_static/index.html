<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprentice Jetson</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111; --card: #1b1b1b; --line: #2a2a2a; --text: #eee; --dim: #999;
    --ok: #4cc26a; --warn: #e0b05a; --err: #e06a6a; --off: #555; --accent: #2d6cdf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 40px; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--dim); font-size: 13px; }
  a { color: #7aa7ff; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
          background: var(--card); font-size: 13px; border: 1px solid var(--line); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  #warnings { margin-bottom: 10px; }
  .banner { padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; background: #3a2f1c; color: #f0c674; }
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 1000px) { .grid { grid-template-columns: 1.25fr 1fr; } .span2 { grid-column: span 2; } }
  section { background: var(--card); border-radius: 10px; padding: 12px; min-width: 0; }
  section h2 { font-size: 13px; margin: 0 0 10px; color: #bbb; text-transform: uppercase; letter-spacing: .04em;
               display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: none; min-height: 40px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #333; color: var(--text); }
  button.danger { background: #a33; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text], select { font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 8px; border: 1px solid #444;
                             background: #111; color: var(--text); min-height: 38px; max-width: 100%; }
  label { font-size: 13px; color: #bbb; display: inline-flex; align-items: center; gap: 6px; }
  .cam-wrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
  .cam-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam-wrap .paused { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .svc { border-top: 1px solid var(--line); padding: 10px 0; }
  .svc:first-of-type { border-top: none; padding-top: 0; }
  .svc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .svc-title { font-weight: 600; }
  .svc-meta { color: var(--dim); font-size: 12px; }
  .desc { color: var(--dim); font-size: 13px; margin: 3px 0 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 6px 0; }
  .opts label { flex-direction: column; align-items: flex-start; gap: 3px; }
  .opts label.inline { flex-direction: row; align-items: center; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { background: #262626; color: #ccc; padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; }
  pre.log { margin: 0; height: 320px; overflow: auto; background: #0a0a0a; border-radius: 8px; padding: 8px;
            font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: #d6d6d6; }
  .board { display: grid; grid-template-columns: 22px repeat(3, 1fr); gap: 4px; max-width: 300px; }
  .board .lbl { color: var(--dim); font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .cell { aspect-ratio: 1; background: #262626; border-radius: 6px; display: flex; flex-direction: column-reverse;
          padding: 3px; gap: 2px; position: relative; }
  .cell .blk { flex: 1; border-radius: 3px; max-height: 32%; }
  .cell .conf { position: absolute; top: 2px; right: 4px; font-size: 10px; color: #ccc; text-shadow: 0 0 2px #000; }
  .cell.expected { outline: 2px dashed #fff; }
  .cell.fault { outline: 2px solid var(--err); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  .feeds { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .feeds { grid-template-columns: auto 1fr; } }
  .hint { font-size: 15px; padding: 8px 10px; background: #222; border-radius: 8px; margin: 6px 0; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #333; padding: 10px 16px;
           border-radius: 8px; font-size: 14px; display: none; max-width: 90vw; z-index: 5; }
  .toast.err { background: #6a2323; }
</style>
</head>
<body>

<header>
  <h1>Apprentice Jetson</h1>
  <span class="sub" id="hostline">connecting...</span>
  <span class="sub"><a href="/ui/" target="_blank">Monitor UI</a> · <a href="/calibrate">Calibration and arm scripts</a></span>
</header>

<div class="pills" id="pills"></div>
<div id="warnings"></div>

<div class="grid">

  <section>
    <h2>Camera <span class="svc-meta" id="cam-status"></span></h2>
    <div class="cam-wrap">
      <img id="cam" alt="overhead camera">
      <div class="paused" id="cam-paused">Stream paused</div>
    </div>
    <div class="row">
      <button id="cam-toggle" onclick="toggleStream()">Pause</button>
      <label><input type="checkbox" id="cam-overlay" onchange="restartStream()"> Detection overlay (slower)</label>
      <select id="cam-w" onchange="restartStream()">
        <option value="640">640 px</option>
        <option value="960" selected>960 px</option>
        <option value="1280">1280 px</option>
        <option value="1920">1920 px</option>
      </select>
      <a href="/snapshot.jpg" target="_blank">Snapshot</a>
    </div>
    <div class="sub">Only one program can use the camera. The stream gives it up while Perception or an arm script runs.</div>
  </section>

  <section>
    <h2>Services</h2>
    <div id="services"></div>
  </section>

  <section class="span2">
    <h2>Live feeds
      <span class="row" style="margin:0">
        <button class="secondary" onclick="brainCmd('start')">Start lesson</button>
        <button class="secondary" onclick="brainCmd('reset')">Reset</button>
      </span>
    </h2>
    <div class="feeds">
      <div>
        <div class="board" id="board"></div>
        <div class="sub" id="board-src" style="margin-top:6px"></div>
      </div>
      <div>
        <div class="kv" id="feed-kv"></div>
        <div class="hint" id="hint" style="display:none"></div>
        <div class="mono" id="progress"></div>
      </div>
    </div>
  </section>

  <section class="span2">
    <h2>Logs <span class="tabs" id="log-tabs"></span></h2>
    <pre class="log" id="log"></pre>
    <div class="row">
      <label><input type="checkbox" id="log-follow" checked> Follow</label>
      <button class="secondary" onclick="clearLogView()">Clear view</button>
    </div>
  </section>

  <section class="span2">
    <h2>System</h2>
    <div class="kv" id="system"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
const COLOR_HEX = { red: "#e5383b", orange: "#f48c06", yellow: "#ffd60a", teal: "#2a9d8f",
                    skyblue: "#5bc0eb", purple: "#8e5ad6", unknown: "#777" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let services = [], lessons = [], logService = null, logSeq = 0, streamOn = true, lastHealth = null;

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = "none"), 3500);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok || body.ok === false) throw new Error(body.error || r.statusText);
  return body;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const dur = (s) => s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${(s / 3600).toFixed(1)}h`;

// ---------- camera
function streamUrl() { return `/stream.mjpg?w=${$("cam-w").value}&overlay=${$("cam-overlay").checked ? 1 : 0}&t=${Date.now()}`; }
function setStream(on) {
  streamOn = on;
  $("cam").src = on ? streamUrl() : "";
  $("cam-paused").style.display = on ? "none" : "flex";
  $("cam-toggle").textContent = on ? "Pause" : "Play";
}
function toggleStream() { setStream(!streamOn); }
function restartStream() { if (streamOn) setStream(true); }
$("cam").onerror = () => { if (streamOn) setTimeout(() => streamOn && setStream(true), 2000); };
document.addEventListener("visibilitychange", () => {   // a hidden tab lets go of the camera
  if (document.hidden) { $("cam").src = ""; } else if (streamOn) { setStream(true); }
});

// ---------- services
function optionInput(svc, o) {
  const id = `opt-${svc.name}-${o.key}`;
  if (o.type === "bool")
    return `<label class="inline"><input type="checkbox" id="${id}" ${o.default ? "checked" : ""}> ${esc(o.label)}</label>`;
  if (o.type === "lesson")
    return `<label>${esc(o.label)}<select id="${id}"><option value="">default (sample-flat-v1)</option>${
      lessons.map((l) => `<option>${esc(l)}</option>`).join("")}</select></label>`;
  return `<label>${esc(o.label)}<input type="text" id="${id}" value="${esc(o.default ?? "")}"></label>`;
}
function renderServices() {
  $("services").innerHTML = services.map((s) => `
    <div class="svc">
      <div class="svc-head">
        <span class="dot ${s.running ? "ok" : s.exit_code ? "err" : ""}"></span>
        <span class="svc-title">${esc(s.title)}</span>
        <span class="svc-meta" id="meta-${s.name}"></span>
      </div>
      <div class="desc">${esc(s.desc)}</div>
      <div class="opts">${s.options.map((o) => optionInput(s, o)).join("")}</div>
      <div class="row">
        <button id="start-${s.name}" onclick="startSvc('${s.name}')">Start</button>
        <button class="danger" id="stop-${s.name}" onclick="stopSvc('${s.name}')">Stop</button>
        <button class="secondary" onclick="showLog('${s.name}')">Logs</button>
      </div>
    </div>`).join("");
  updateServiceState();
}
function updateServiceState() {
  for (const s of services) {
    const meta = $(`meta-${s.name}`); if (!meta) continue;
    meta.textContent = s.running ? `running ${dur(s.uptime_s)} · pid ${s.pid}` :
      s.exit_code != null ? `stopped (exit ${s.exit_code})` : "stopped";
    meta.previousElementSibling.previousElementSibling.className = `dot ${s.running ? "ok" : s.exit_code ? "err" : ""}`;
    $(`start-${s.name}`).disabled = s.running;
    $(`stop-${s.name}`).disabled = !s.running;
  }
  $("log-tabs").innerHTML = services.map((s) =>
    `<button class="tab ${s.name === logService ? "active" : ""}" onclick="showLog('${s.name}')">${esc(s.title)}${s.running ? " ●" : ""}</button>`).join("");
}
async function startSvc(name) {
  const svc = services.find((s) => s.name === name), options = {};
  for (const o of svc.options) {
    const el = $(`opt-${name}-${o.key}`);
    options[o.key] = o.type === "bool" ? el.checked : el.value;
  }
  try { await post(`/api/services/${name}/start`, { options }); toast(`${svc.title} started`); showLog(name); }
  catch (e) { toast(e.message, true); }
  refreshServices();
}
async function stopSvc(name) {
  toast("Stopping...");
  try { await post(`/api/services/${name}/stop`); toast("Stopped"); } catch (e) { toast(e.message, true); }
  refreshServices();
}
async function refreshServices(full) {
  try {
    const d = await api("/api/services");
    const changed = full || d.services.length !== services.length;
    services = d.services; lessons = d.lessons;
    if (!logService && services.length) logService = services[0].name;
    changed ? renderServices() : updateServiceState();
  } catch (e) { /* server restarting; next poll retries */ }
}

// ---------- logs
function showLog(name) { if (name !== logService) { logService = name; logSeq = 0; $("log").textContent = ""; } updateServiceState(); pollLog(); }
function clearLogView() { $("log").textContent = ""; }
async function pollLog() {
  if (!logService) return;
  try {
    const d = await api(`/api/services/${logService}/log?after=${logSeq}`);
    if (d.seq < logSeq) { logSeq = 0; $("log").textContent = ""; return; }
    if (d.lines.length) {
      const el = $("log");
      el.textContent += d.lines.map((l) => l.text).join("\n") + "\n";
      if (el.textContent.length > 200000) el.textContent = el.textContent.slice(-150000);
      logSeq = d.lines[d.lines.length - 1].seq;
      if ($("log-follow").checked) el.scrollTop = el.scrollHeight;
    }
  } catch (e) { }
}

// ---------- feeds
function renderBoard(board, conf, expected, fault) {
  let html = "";
  for (const row of ["3", "2", "1"]) {           // back row on top, operator side at the bottom
    html += `<div class="lbl">${row}</div>`;
    for (const col of ["A", "B", "C"]) {
      const cell = col + row, stack = (board && board[cell]) || [];
      const c = conf && conf[cell] != null && stack.length ? `<span class="conf">${conf[cell].toFixed(2)}</span>` : "";
      const cls = ["cell", cell === expected ? "expected" : "", cell === fault ? "fault" : ""].join(" ");
      html += `<div class="${cls}" title="${cell}: ${esc(stack.join(", ") || "empty")}">${c}${
        stack.map((col) => `<div class="blk" style="background:${COLOR_HEX[col] || "#777"}"></div>`).join("")}</div>`;
    }
  }
  html += `<div></div>` + ["A", "B", "C"].map((c) => `<div class="lbl">${c}</div>`).join("");
  $("board").innerHTML = html;
}
function feedLine(f, port) {
  if (!f.connected) return `<span style="color:var(--dim)">not connected (ws :${port})</span>`;
  return `${f.hz} Hz · ${f.count} msgs · last ${f.age_s ?? "-"}s ago`;
}
async function refreshFeeds() {
  let d; try { d = await api("/api/feeds"); } catch (e) { return; }
  const g = d.grid, s = d.session, gs = g.last || {}, ss = s.connected ? (s.last || {}) : {};
  const board = s.connected && ss.board ? ss.board : gs.board;
  renderBoard(board, gs.confidence, ss.expected_cell, ss.fault_cell);
  $("board-src").textContent = s.connected && ss.board ? "Board from the brain (stable board)" :
    g.connected ? "Board from perception (raw)" : "No feed yet. Start Simulation, or Perception.";
  const rows = [
    ["Perception :8765", feedLine(g, 8765)],
    ["Brain :8766", feedLine(s, 8766)],
  ];
  if (g.connected) rows.push(["arm / hands clear", `${gs.arm_clear ? "yes" : "no"} / ${gs.hands_clear ? "yes" : "no"}`]);
  if (s.connected && ss.mode) {
    rows.push(["Lesson", esc(ss.lesson_title || ss.lesson_id)]);
    rows.push(["Mode / phase", `${esc(ss.mode)} / ${esc(ss.phase)}`]);
    rows.push(["Step", ss.expected_step ? `${ss.step_index + 1}: ${esc(ss.expected_step.color)} on ${esc(ss.expected_step.cell)} level ${ss.expected_step.level}` : `${ss.step_index}`]);
    rows.push(["Verdict", `${esc(ss.verdict)}${ss.fault_cell ? " at " + esc(ss.fault_cell) : ""}`]);
    if (ss.mode === "robot") rows.push(["Robot", esc(ss.robot_status)]);
    if (ss.mode === "human") rows.push(["Hint level", ss.hint_level]);
  }
  $("feed-kv").innerHTML = rows.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("");
  $("hint").style.display = ss.hint_text ? "block" : "none";
  $("hint").textContent = ss.hint_text || "";
  const p = ss.progress || {};
  $("progress").textContent = Object.keys(p).filter((k) => p[k] && p[k].length).map((k) => `${k}: ${p[k].join(" ")}`).join("\n");
}
async function brainCmd(cmd) {
  try { await post("/api/brain/cmd", { cmd }); toast(cmd === "start" ? "Start sent" : "Reset sent"); }
  catch (e) { toast(e.message, true); }
}

// ---------- health
function pill(label, cls, title) { return `<span class="pill" title="${esc(title || "")}"><span class="dot ${cls}"></span>${label}</span>`; }
async function refreshHealth() {
  let h; try { h = await api("/api/health"); } catch (e) { $("hostline").textContent = "dashboard not reachable"; return; }
  lastHealth = h;
  const hot = Math.max(0, ...Object.values(h.temps_c));
  $("hostline").textContent = `${h.host.hostname} · ${h.host.ips.join(", ")} · up ${dur(h.host.uptime_s)}`;
  const cam = h.camera, serialOk = h.robot_port && h.serial.some((s) => s.path === h.robot_port_real && s.rw);
  $("cam-status").textContent = cam.busy ? `in use by ${cam.busy}` : cam.open ? `open (index ${cam.index})` : `closed (index ${cam.index})`;
  $("pills").innerHTML = [
    pill(`Camera ${cam.busy ? "busy" : cam.open ? "streaming" : "idle"}`, cam.error ? "err" : cam.busy ? "warn" : "ok", cam.error || cam.busy || ""),
    pill("Perception :8765", h.ports["8765"] ? "ok" : ""),
    pill("Brain :8766", h.ports["8766"] ? "ok" : ""),
    pill("Robot API :8770", h.ports["8770"] ? "ok" : "", "not built yet (robot/README.md)"),
    pill(`Arm serial ${h.robot_port_real || "?"}`, serialOk ? "ok" : "err", h.robot_port || "ROBOT_PORT not set"),
    pill(h.arm_script ? `Arm script: ${h.arm_script}` : "No arm script", h.arm_script ? "warn" : ""),
    pill(`${hot} °C`, hot >= 85 ? "err" : hot >= 70 ? "warn" : "ok"),
  ].join("");
  $("warnings").innerHTML = h.warnings.map((w) => `<div class="banner">${esc(w)}</div>`).join("");
  const m = h.mem_mib, cal = h.calibration;
  const rows = [
    ["Jetson", esc(h.host.l4t || "")],
    ["Load (1/5/15 min)", `${h.host.load.map((x) => x.toFixed(2)).join(" / ")} on ${h.host.cpus} cores`],
    ["Memory", `${m.MemAvailable} MiB free of ${m.MemTotal}` + (m.SwapTotal ? ` · swap ${m.SwapTotal - m.SwapFree}/${m.SwapTotal} MiB used` : "")],
    ["Disk", `${h.disk_gb.free} GB free of ${h.disk_gb.total}`],
    ["Temperatures", Object.entries(h.temps_c).map(([k, v]) => `${k.replace("-thermal", "")} ${v}`).join(" · ")],
    ["Cameras", h.cameras.map((c) => `${c.path} (${esc(c.name)})`).join(", ") || "none"],
    ["Serial", h.serial.map((s) => `${s.path}${s.rw ? "" : " (no permission)"}`).join(", ") || "none"],
    ["Calibration", `perception colors: ${cal.perception_colors} · grid lock: ${cal.perception_grid_lock} · arm sheet: ${cal.arm_sheet} · placement: ${cal.placement_correction}`],
    ["Git", `${esc(h.git.branch)} · ${esc(h.git.commit)} · ${h.git.dirty} uncommitted file(s)`],
    ["Python", `<span class="mono">${esc(h.python.exe || "not found")}</span>`],
  ];
  $("system").innerHTML = rows.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("");
}

// ---------- loops
setStream(true);
refreshServices(true);
refreshHealth();
refreshFeeds();
setInterval(refreshServices, 1500);
setInterval(refreshFeeds, 500);
setInterval(pollLog, 1000);
setInterval(refreshHealth, 4000);
</script>
</body>
</html>
