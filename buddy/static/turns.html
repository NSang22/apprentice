<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Take Turns · Apprentice Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Same look as buddy/static/index.html (copied so this game's screen merges without touching it). */
  :root {
    --green: #58cc02; --green-d: #58a700; --green-l: #d7ffb8;
    --blue: #1cb0f6; --blue-d: #1899d6; --blue-l: #ddf4ff;
    --yellow: #ffc800; --yellow-d: #e5a400; --yellow-l: #fff5cc;
    --red: #ff4b4b; --red-d: #ea2b2b;
    --orange: #ff9600; --orange-d: #d97c00; --orange-l: #fff0d9;
    --ink: #3c3c3c; --dim: #777; --line: #e5e5e5; --soft: #f7f7f7;
    --c-red: #ff4b4b; --c-red-d: #d63434; --c-yellow: #ffc800; --c-yellow-d: #d9a400;
    --c-teal: #14c4a8; --c-teal-d: #0e9a84; --c-purple: #a560e8; --c-purple-d: #7d3fc0;
    --c-orange: #ff9600; --c-orange-d: #d97c00; --c-skyblue: #1cb0f6; --c-skyblue-d: #1590ca;
    --c-unknown: #bbb; --c-unknown-d: #999;
    --pip: #14c4a8; --pip-d: #0e9a84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: var(--ink); font-family: "Nunito", ui-rounded, system-ui, sans-serif; font-weight: 700;
         -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  .btn { font: inherit; font-weight: 800; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; border: 0; border-radius: 16px;
         padding: 15px 20px; width: 100%; color: #fff; background: var(--green); box-shadow: 0 4px 0 var(--green-d); cursor: pointer;
         display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .05s, box-shadow .05s; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--green-d); }
  .btn:disabled { background: var(--line); color: #afafaf; box-shadow: 0 4px 0 #d0d0d0; }
  .btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); }
  .btn.orange { background: var(--orange); box-shadow: 0 4px 0 var(--orange-d); }
  .icon-btn { background: none; border: 0; padding: 6px; cursor: pointer; color: #afafaf; }
  .pip { width: 110px; height: 120px; flex: none; animation: bob 2.6s ease-in-out infinite; }
  .pip.small { width: 72px; height: 80px; }
  .pip .body { fill: var(--pip); } .pip .body-d { fill: var(--pip-d); }
  .pip .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  .pip .mouth { display: none; } .pip .arm-up { display: none; }
  .pip[data-mood="happy"] .m-happy, .pip[data-mood="encourage"] .m-happy, .pip[data-mood="look"] .m-oh,
  .pip[data-mood="think"] .m-flat, .pip[data-mood="cheer"] .m-big { display: inline; }
  .pip[data-mood="cheer"] .arm-down { display: none; } .pip[data-mood="cheer"] .arm-up { display: inline; }
  .pip[data-mood="cheer"] { animation: hop .6s ease-in-out infinite; }
  .pip[data-mood="think"] .pupils { transform: translate(2px, -3px); }
  .pip[data-mood="encourage"] { animation: tilt 2.4s ease-in-out infinite; }
  .pip .antenna-bulb { animation: glow 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) } }
  @keyframes tilt { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes glow { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .pip-wrap { display: flex; align-items: flex-end; gap: 10px; margin: 10px 0 6px; width: 100%; }
  .bubble { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 11px 14px; font-size: 17px;
            line-height: 1.3; flex: 1; margin-bottom: 22px; min-height: 48px; }
  .bubble::before { content: ""; position: absolute; left: -11px; bottom: 16px; width: 18px; height: 18px; background: #fff;
                    border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
  .game-top { display: flex; align-items: center; gap: 12px; padding: 4px 0 6px; }
  .bar { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .4s; }
  .stat { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 16px; color: var(--yellow-d); }
  .stat svg { width: 26px; height: 26px; }
  .turns { display: flex; gap: 10px; margin: 6px 0 2px; }
  .who { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; border: 2px solid var(--line);
         color: #afafaf; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; transition: all .2s; }
  .who svg { width: 30px; height: 30px; flex: none; }
  .who.on { border-color: #84d8ff; background: var(--blue-l); color: var(--blue-d); box-shadow: 0 3px 0 #84d8ff; }
  .who .you { width: 30px; height: 30px; border-radius: 50%; background: var(--yellow); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 4px 0; }
  .side { font-size: 12px; font-weight: 800; color: #afafaf; text-transform: uppercase; letter-spacing: .08em; margin: -4px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(80vw, 330px); padding: 12px; background: var(--soft);
          border: 2px solid var(--line); border-radius: 22px; }
  .cell { aspect-ratio: 1; border-radius: 16px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line);
          position: relative; display: flex; align-items: center; justify-content: center; }
  .cell.tappable { cursor: pointer; }
  .cell.tappable:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .cell.glow { border-color: var(--yellow); box-shadow: 0 0 0 5px var(--yellow-l), 0 4px 0 var(--yellow-d); animation: pulse 1s ease-in-out infinite; z-index: 1; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
  .blk { position: absolute; inset: 7%; border-radius: 13px; background: var(--c); box-shadow: 0 6px 0 var(--cd), inset 0 -6px 0 rgba(0,0,0,.08);
         animation: pop .22s cubic-bezier(.3,1.6,.6,1); }
  .blk::after { content: ""; position: absolute; left: 14%; top: 12%; width: 34%; height: 18%; border-radius: 9px; background: rgba(255,255,255,.4); }
  .blk.ghost { background: transparent; box-shadow: none; border: 4px dashed var(--c); animation: none; opacity: .75; }
  .blk.ghost::after { display: none; }
  @keyframes pop { from { transform: scale(.4) } to { transform: scale(1) } }
  .badge { position: absolute; right: -7px; top: -7px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
           justify-content: center; color: #fff; z-index: 2; border: 3px solid #fff; }
  .badge svg { width: 13px; height: 13px; } .badge.ok { background: var(--green); } .badge.no { background: var(--red); }
  .palette { display: flex; gap: 12px; justify-content: center; }
  .chip { width: 56px; height: 56px; border-radius: 16px; border: 3px solid transparent; background: #fff; padding: 5px; cursor: pointer;
          box-shadow: 0 4px 0 var(--line); outline: 2px solid var(--line); }
  .chip i { display: block; width: 100%; height: 100%; border-radius: 10px; background: var(--c); box-shadow: inset 0 -5px 0 var(--cd); }
  .chip.on { outline: 3px solid var(--blue); background: var(--blue-l); transform: translateY(-3px); box-shadow: 0 7px 0 #84d8ff; }
  .footer { padding-top: 10px; min-height: 70px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1.1);
           padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); background: var(--green-l); }
  .sheet.on { transform: translateY(0); }
  .sheet .inner { max-width: 448px; margin: 0 auto; }
  .sheet h3 { margin: 0 0 4px; font-size: 24px; font-weight: 900; color: var(--green-d); display: flex; align-items: center; gap: 10px; }
  .sheet p { margin: 0 0 14px; font-size: 16px; }
  .stars { display: inline-flex; gap: 2px; margin-left: auto; } .stars svg { width: 26px; height: 26px; }
  .xp { color: var(--blue); font-weight: 900; }
  h1 { font-size: 30px; font-weight: 900; margin: 6px 0; text-align: center; }
  .lead { text-align: center; color: var(--dim); font-size: 17px; line-height: 1.4; margin: 0 8px 18px; }
  .field label { display: block; font-size: 14px; color: var(--dim); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; font: inherit; font-weight: 800; font-size: 15px; padding: 10px 4px; border-radius: 14px; border: 2px solid var(--line);
                background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--line); cursor: pointer; line-height: 1.15; }
  .seg button small { display: block; font-size: 12px; color: var(--dim); font-weight: 700; }
  .seg button.on { border-color: #84d8ff; background: var(--blue-l); color: var(--blue-d); box-shadow: 0 3px 0 #84d8ff; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ccc; margin-right: 4px; vertical-align: middle; }
  .dot.ok { background: var(--green); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; width: 100%; }
  .card { border-radius: 16px; border: 2px solid var(--c); overflow: hidden; text-align: center; }
  .card small { display: block; background: var(--c); color: #fff; font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 5px 2px; }
  .card b { display: block; font-size: 22px; font-weight: 900; color: var(--c); padding: 12px 2px; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px;
           border-radius: 14px; font-size: 15px; z-index: 9; display: none; max-width: 90vw; text-align: center; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
  .eye-btn { background: var(--blue-l); border: 2px solid #84d8ff; border-radius: 12px; padding: 4px 8px; cursor: pointer; color: var(--blue-d);
             font: inherit; font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .eye-btn.on { background: var(--blue); color: #fff; border-color: var(--blue-d); }
  .cam { width: 100%; border-radius: 14px; background: #000; display: none; aspect-ratio: 16/9; object-fit: contain; }
  .cam.on { display: block; }
</style>
<script src="/app/nav.js" defer></script>
</head>
<body>
<div class="app">

  <!-- intro -->
  <section class="screen" id="s-intro">
    <div class="game-top"><a class="icon-btn" href="/buddy" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a></div>
    <div style="display:flex;justify-content:center;margin-top:10px"><svg class="pip" data-mood="cheer" style="width:140px;height:154px"><use href="#pip"/></svg></div>
    <h1>Take Turns</h1>
    <p class="lead">Pip and you build the picture together, one block each. Pip goes first!</p>
    <div class="field"><label>Play on</label><div class="seg" id="source"></div></div>
    <div style="flex:1"></div>
    <div class="footer"><button class="btn" id="go">Let's build!</button></div>
  </section>

  <!-- game -->
  <section class="screen" id="s-game">
    <div class="game-top">
      <button class="icon-btn" id="quit" aria-label="Stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      <div class="bar"><i id="bar"></i></div>
      <button class="eye-btn" id="eye" aria-label="Pip's eyes">👁 Eyes</button>
      <div class="stat"><svg><use href="#i-star-fill"/></svg><span id="stars">0</span></div>
    </div>
    <div class="turns">
      <div class="who" id="who-pip"><svg><use href="#pip-head"/></svg>Pip</div>
      <div class="who" id="who-you"><span class="you">★</span><span id="you-name">You</span></div>
    </div>
    <div class="stage">
      <div class="pip-wrap"><svg class="pip small" id="pip" data-mood="happy"><use href="#pip"/></svg><div class="bubble" id="say"></div></div>
      <img class="cam" id="cam" alt="What Pip sees">
      <div class="side">Pip's side</div>
      <div class="grid" id="grid"></div>
      <div class="side">Your side</div>
      <div class="palette" id="palette"></div>
    </div>
    <div class="footer" id="footer"></div>
  </section>

  <!-- lesson over -->
  <section class="screen" id="s-over">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <svg class="pip" data-mood="cheer" style="width:150px;height:164px"><use href="#pip"/></svg>
      <h1 style="color:var(--yellow-d)">What a team!</h1>
      <p class="lead" id="over-say"></p>
      <div class="cards">
        <div class="card" style="--c:var(--yellow-d)"><small>Stars</small><b id="o-stars">0</b></div>
        <div class="card" style="--c:var(--green)"><small>Built</small><b id="o-built">0</b></div>
        <div class="card" style="--c:var(--blue)"><small>Helped Pip</small><b id="o-help">0</b></div>
      </div>
    </div>
    <div class="footer"><button class="btn" id="done">Continue</button></div>
  </section>
</div>

<div class="sheet" id="sheet"><div class="inner">
  <h3><span>We built it!</span><span class="stars" id="r-stars"></span></h3>
  <p><span id="r-say"></span> <span class="xp" id="r-xp"></span></p>
  <button class="btn" id="next">Next picture</button>
</div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="pip" viewBox="0 0 120 132">
    <line x1="60" y1="22" x2="60" y2="9" stroke="var(--pip-d)" stroke-width="4" stroke-linecap="round"/>
    <circle class="antenna-bulb" cx="60" cy="8" r="6" fill="#ffc800"/>
    <g class="arm-down"><rect class="body-d" x="16" y="94" width="14" height="28" rx="7" transform="rotate(14 23 96)"/><rect class="body-d" x="90" y="94" width="14" height="28" rx="7" transform="rotate(-14 97 96)"/></g>
    <g class="arm-up"><rect class="body-d" x="14" y="70" width="14" height="30" rx="7" transform="rotate(-28 21 98)"/><rect class="body-d" x="92" y="70" width="14" height="30" rx="7" transform="rotate(28 99 98)"/></g>
    <rect class="body-d" x="32" y="88" width="56" height="38" rx="16"/><rect class="body" x="32" y="86" width="56" height="36" rx="16"/>
    <circle cx="60" cy="104" r="7" fill="#fff" opacity=".85"/>
    <rect class="body-d" x="16" y="26" width="88" height="68" rx="28"/><rect class="body" x="16" y="22" width="88" height="68" rx="28"/>
    <rect x="27" y="34" width="66" height="44" rx="19" fill="#fff"/>
    <g class="pupils" style="transition:transform .3s"><ellipse class="eye" cx="47" cy="54" rx="7" ry="9" fill="#2b2b2b"/><ellipse class="eye" cx="73" cy="54" rx="7" ry="9" fill="#2b2b2b"/>
      <circle cx="49.5" cy="50.5" r="2.4" fill="#fff"/><circle cx="75.5" cy="50.5" r="2.4" fill="#fff"/></g>
    <ellipse cx="36" cy="66" rx="5" ry="3.2" fill="#ff8fa3" opacity=".7"/><ellipse cx="84" cy="66" rx="5" ry="3.2" fill="#ff8fa3" opacity=".7"/>
    <path class="mouth m-happy" d="M51 66 Q60 74 69 66" fill="none" stroke="#2b2b2b" stroke-width="3.2" stroke-linecap="round"/>
    <path class="mouth m-big" d="M49 64 Q60 80 71 64 Z" fill="#2b2b2b"/>
    <path class="mouth m-flat" d="M54 69 L67 67" fill="none" stroke="#2b2b2b" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse class="mouth m-oh" cx="60" cy="68" rx="4" ry="4.6" fill="#2b2b2b"/>
  </symbol>
  <symbol id="pip-head" viewBox="16 4 88 90">
    <line x1="60" y1="22" x2="60" y2="9" stroke="var(--pip-d)" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="8" r="6" fill="#ffc800"/>
    <rect x="16" y="22" width="88" height="68" rx="28" fill="var(--pip)"/><rect x="27" y="34" width="66" height="44" rx="19" fill="#fff"/>
    <ellipse cx="47" cy="54" rx="7" ry="9" fill="#2b2b2b"/><ellipse cx="73" cy="54" rx="7" ry="9" fill="#2b2b2b"/>
    <path d="M51 66 Q60 74 69 66" fill="none" stroke="#2b2b2b" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
</defs></svg>

<script>
const $ = (id) => document.getElementById(id);
const PIP = { teal: ["#14c4a8", "#0e9a84"], purple: ["#a560e8", "#7d3fc0"], red: ["#ff4b4b", "#d63434"], yellow: ["#ffc800", "#d9a400"] };
// Cells as printed on the sheet: letter = row (A on Pip's edge), number = column (1-3 left to right for the child).
const ROWS = ["A", "B", "C"], COLS = ["1", "2", "3"];
let S = null, chosen = null, busy = false, lastPhase = null;

let ac = null;
function tone(f, dur = .12, type = "triangle", gap = .09, vol = .16) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    f.forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * gap;
      o.type = type; o.frequency.value = fr; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur); }); } catch (e) {}
}
const sfx = { tap: () => tone([660], .06), good: () => tone([660, 880, 1320], .16), turn: () => tone([523, 784], .12),
              oops: () => tone([392, 330], .18, "triangle", .14), win: () => tone([523, 659, 784, 1047, 1319], .2, "triangle", .11) };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong");
  return d;
}
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3200); }
async function act(path, body) {
  if (busy) return false; busy = true;
  try { S = await api(path, body || {}); render(); return true; } catch (e) { toast(e.message); return false; } finally { busy = false; }
}
const blockHtml = (c, cls = "") => `<div class="blk ${cls}" style="--c:var(--c-${c});--cd:var(--c-${c}-d)"></div>`;
const badge = (ok) => `<div class="badge ${ok ? "ok" : "no"}"><svg><use href="#i-${ok ? "check" : "x"}"/></svg></div>`;
function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === "s-" + id)); }

function renderGrid() {
  const practiceTurn = S.source === "practice" && S.phase === "child_turn";
  let html = "";
  for (const r of ROWS) for (const c of COLS) {
    const cell = r + c, want = S.target[cell], have = (S.board[cell] || [])[0];
    let inner = "";
    if (have) inner = blockHtml(have) + (want ? (have === want ? badge(true) : badge(false)) : badge(false));
    else if (want) inner = blockHtml(want, "ghost");
    html += `<div class="cell ${S.glow === cell ? "glow" : ""} ${practiceTurn ? "tappable" : ""}" data-cell="${cell}">${inner}</div>`;
  }
  if ($("grid").dataset.k !== html) { $("grid").dataset.k = html; $("grid").innerHTML = html; }
}

function renderPalette() {
  const p = $("palette");
  if (!(S.source === "practice" && S.phase === "child_turn")) { p.style.display = "none"; return; }
  p.style.display = "flex";
  if (!chosen || !S.colors.includes(chosen)) chosen = S.colors[0];
  const html = S.colors.map((c) => `<button class="chip ${c === chosen ? "on" : ""}" data-color="${c}" aria-label="${c}"><i style="--c:var(--c-${c});--cd:var(--c-${c}-d)"></i></button>`).join("");
  if (p.dataset.k !== html) { p.dataset.k = html; p.innerHTML = html; }
}

function renderFooter() {
  const ph = S.phase;
  const key = ph === "child_turn" ? "pip" : ph === "need_supply" ? "retry" : S.scan_stuck ? "rescan" : ["pip_turn", "pip_check", "pointing", "child_check", "clear", "bank_check"].includes(ph) ? "wait" : "";
  if ($("footer").dataset.k === key) return;
  $("footer").dataset.k = key;
  $("footer").innerHTML = key === "pip" ? `<button class="btn blue" id="f-pip">Your turn, Pip!</button>`
    : key === "retry" ? `<button class="btn orange" id="f-retry">Try again</button>`
    : key === "rescan" ? `<button class="btn blue" id="f-retry">Scan again</button>`
    : key === "wait" ? `<button class="btn" disabled>${ph === "clear" ? "Clear the board" : ph.startsWith("pip") ? "Pip is building..." : "Pip is looking..."}</button>` : "";
  if ($("f-pip")) $("f-pip").onclick = () => { sfx.turn(); act("/api/buddy/turns/pip"); };
  if ($("f-retry")) $("f-retry").onclick = () => { sfx.tap(); act("/api/buddy/turns/retry"); };
}

function renderIntro() {
  const cam = S.table.connected && S.table.fresh;
  const html = [["table", "Table", `<span class="dot ${cam ? "ok" : ""}"></span>${cam ? "camera on" : "camera off"}`], ["practice", "Practice", "tap the phone"]]
    .map(([v, t, s]) => `<button class="${v === S.source ? "on" : ""}" data-source="${v}">${t}<small>${s}</small></button>`).join("");
  if ($("source").dataset.k !== html) { $("source").dataset.k = html; $("source").innerHTML = html; }
}

function render() {
  if (!S) return;
  const [c, d] = PIP[S.profile.avatar] || PIP.teal;
  document.documentElement.style.setProperty("--pip", c); document.documentElement.style.setProperty("--pip-d", d);
  if (!S.profile.name) { location.href = "/buddy"; return; }   // first run happens on the main app
  const ph = S.phase;
  if (ph === "home") { renderIntro(); show("intro"); }
  else if (ph === "over") {
    const s = S.summary || {};
    $("o-stars").textContent = `${s.stars}/${s.max_stars}`; $("o-built").textContent = s.rounds; $("o-help").textContent = s.helped_pip;
    $("over-say").textContent = S.say; show("over");
    if (lastPhase !== "over") { sfx.win(); confetti(150); }
  } else {
    show("game");
    const total = Object.keys(S.target).length;
    $("bar").style.width = `${total ? (S.right.length / total) * 100 : 0}%`;
    $("stars").textContent = S.stars.reduce((a, b) => a + b, 0);
    $("you-name").textContent = S.profile.name;
    $("who-pip").classList.toggle("on", S.turn === "pip" && ph !== "round_done");
    $("who-you").classList.toggle("on", S.turn === "child" && ph !== "round_done");
    $("pip").dataset.mood = S.mood; $("say").textContent = S.say;
    renderGrid(); renderPalette(); renderFooter();
    if (ph === "child_turn" && lastPhase && lastPhase !== "child_turn" && lastPhase !== "pointing") (S.glow ? sfx.oops : sfx.turn)();
  }
  const sheet = ph === "round_done";
  $("sheet").classList.toggle("on", sheet);
  if (sheet) {
    $("r-stars").innerHTML = [0, 1, 2].map((i) => `<svg style="color:${i < S.round_stars ? "var(--yellow)" : "#e5e5e5"}"><use href="#i-star-fill"/></svg>`).join("");
    $("r-say").textContent = S.say; $("r-xp").textContent = `+${S.gained} XP`;
    $("next").textContent = S.round >= S.rounds ? "Finish" : "Next picture";
    if (lastPhase !== "round_done") { sfx.good(); if (S.round_stars === 3) confetti(70); }
  }
  lastPhase = ph;
}

function confetti(n) {
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#58cc02", "#1cb0f6", "#ffc800", "#ff4b4b", "#a560e8", "#ff9600"];
  const parts = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0] }));
  let t = 0;
  (function step() { ctx.clearRect(0, 0, W, H);
    for (const p of parts) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore(); }
    if (++t < 140) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H); })();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-cell],[data-color],[data-source]");
  if (!t) return;
  if (t.dataset.cell && S.phase === "child_turn" && S.source === "practice") {
    const cur = (S.board[t.dataset.cell] || [])[0], color = cur === chosen ? null : chosen;
    sfx.tap(); S.board[t.dataset.cell] = color ? [color] : []; renderGrid();
    act("/api/buddy/turns/cell", { cell: t.dataset.cell, color });
  } else if (t.dataset.color) { chosen = t.dataset.color; sfx.tap(); renderPalette(); }
  else if (t.dataset.source) { sfx.tap(); api("/api/buddy/settings", { source: t.dataset.source }).then(poll1); }
});
$("go").onclick = () => { sfx.tap(); act("/api/buddy/turns/start"); };
$("next").onclick = () => { sfx.tap(); act("/api/buddy/turns/next"); };
$("quit").onclick = () => { if (confirm("Stop building?")) act("/api/buddy/turns/quit"); };
$("done").onclick = async () => { await act("/api/buddy/turns/quit"); location.href = "/buddy"; };


// "Pip's eyes": the live camera (perception's frame server), refreshed while it is open
let camOn = false, camTimer = null;
function toggleCam() {
  camOn = !camOn; $("eye").classList.toggle("on", camOn); $("cam").classList.toggle("on", camOn);
  clearInterval(camTimer);
  const load = () => { const img = new Image(); img.onload = () => { $("cam").src = img.src; }; img.onerror = () => { if (camOn) toast("The camera is off. Turn on the table (⚙ on the home screen)."); camOn && toggleCam(); }; img.src = `/buddy/camera.jpg?t=${Date.now()}`; };
  if (camOn) { load(); camTimer = setInterval(load, 700); }
}
$("eye").onclick = toggleCam;

async function poll1() { try { if (!busy) { S = await api("/api/buddy/turns/state"); render(); } } catch (e) {} }
async function poll() { await poll1(); setTimeout(poll, S && S.phase !== "home" && S.phase !== "over" ? 400 : 1000); }
poll();
</script>
</body>
</html>
